# Splunk Enterprise trial (60 days, 500 MB/day indexing) for the learning lab.
#
# Two license acceptances are required by recent images. Setting only
# SPLUNK_START_ARGS leaves the container in a crash loop whose verdict is buried
# under a 12-line legal notice — see docs/troubleshooting.md.
services:
  splunk:
    image: splunk/splunk:latest
    container_name: ${LAB_CONTAINER:-splunk-lab}
    restart: unless-stopped
    mem_limit: ${LAB_MEMORY:-2600m}
    ports:
      - "127.0.0.1:${LAB_PORT:-8010}:8000"      # Splunk Web, loopback only by design
      - "127.0.0.1:${LAB_MGMT_PORT:-8089}:8089" # management API, loopback only
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?run setup/lab.sh init first}
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/en-US/account/login"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

volumes:
  splunk-etc:
  splunk-var:
